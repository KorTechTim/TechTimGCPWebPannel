<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechTim Enshrouded Panel</title><link rel="stylesheet" href="/static/app.css?v=1.0.1"></head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand">
      <img src="/static/enshrouded-panel-mark-v1.png" alt="" class="login-mark">
      <p class="eyebrow">TECHTIM · EMBER REALM</p>
      <h1 data-i18n="login_title">관리자 성화에 입장</h1>
      <p data-i18n="login_copy">Google Cloud의 Enshrouded 서버를 안전하게 관리합니다.</p>
    </section>
    <section class="login-panel">
      <label class="language-field"><span class="sr-only" data-i18n="language">한국어</span><select data-language-select aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></label>
      <form id="login-form">
        <label><span data-i18n="username">관리자 계정</span><input name="username" value="admin" autocomplete="username" required></label>
        <label><span data-i18n="password">비밀번호</span><input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary wide" data-i18n="login">로그인</button>
      </form>
      <form id="password-form" hidden>
        <h2 data-i18n="initial_title">첫 관리자 비밀번호 설정</h2><p data-i18n="initial_copy">기본 비밀번호 admin 대신 사용할 새 패널 비밀번호를 입력하세요.</p>
        <label><span data-i18n="new_password">새 비밀번호</span><input name="new_password" type="password" minlength="4" maxlength="128" autocomplete="new-password" required></label>
        <button class="primary wide" data-i18n="save_password">비밀번호 저장</button>
      </form>
      <p id="login-message" class="form-message" role="alert"></p>
    </section>
  </main>
  <script src="/static/i18n.js?v=1.0.1"></script><script src="/static/login.js?v=1.0.1"></script>
</body></html>
