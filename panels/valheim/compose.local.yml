services:
  valheim-panel:
    build: .
    image: techtim/valheim-panel:local
    container_name: valheim-panel
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      DATA_DIR: /data
      HOST_DATA_DIR: ${VALHEIM_DATA_DIR:?Set an absolute host directory}
      VALHEIM_RUNTIME_IMAGE: techtim/valheim-runtime:local
      PULL_RUNTIME_IMAGE: '0'
      PANEL_IMAGE: techtim/valheim-panel:local
    volumes:
      - ${VALHEIM_DATA_DIR}:/data
      - /var/run/docker.sock:/var/run/docker.sock
