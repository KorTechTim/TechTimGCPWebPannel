name: Build Palworld Panel

on:
  push:
    branches:
      - main
    paths:
      - "panels/palworld/**"
      - "palworld/**"
      - ".github/workflows/build-palworld-panel.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/kortechtim

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r panels/palworld/requirements.txt

      - name: Run Palworld tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s panels/palworld/tests -v

      - name: Check shell scripts
        run: |
          bash -n palworld/palworld-webui-install.sh
          bash -n panels/palworld/runtime/entrypoint.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Palworld runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./panels/palworld/runtime
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/palworld-runtime:latest
            ${{ env.IMAGE_PREFIX }}/palworld-runtime:steamcmd-nonroot-v1
            ${{ env.IMAGE_PREFIX }}/palworld-runtime:${{ github.sha }}

      - name: Verify Palworld runtime drops root privileges
        run: |
          docker pull "${IMAGE_PREFIX}/palworld-runtime:${GITHUB_SHA}"
          docker run --rm "${IMAGE_PREFIX}/palworld-runtime:${GITHUB_SHA}" check-user

      - name: Build and push Palworld panel image
        uses: docker/build-push-action@v6
        with:
          context: ./panels/palworld
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/palworld-panel:latest
            ${{ env.IMAGE_PREFIX }}/palworld-panel:${{ github.sha }}
