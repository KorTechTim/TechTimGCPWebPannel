name: Build Valheim Panel
on:
  pull_request:
    paths: ['panels/valheim/**', 'valheim/**', '.github/workflows/build-valheim-panel.yml']
  push:
    branches: [main]
    paths: ['panels/valheim/**', 'valheim/**', '.github/workflows/build-valheim-panel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r panels/valheim/requirements-dev.txt
      - name: Run Valheim tests
        env:
          PYTHONPATH: panels/valheim
          DATA_DIR: /tmp/valheim-tests-bootstrap
          HOST_DATA_DIR: /tmp/valheim-tests-bootstrap
          SCHEDULER_ENABLED: '0'
        run: python -m unittest discover -s panels/valheim/tests -v
      - name: Check scripts
        run: |
          bash -n valheim/valheim-webui-install.sh
          bash -n valheim/gcp-create.sh
          bash -n panels/valheim/runtime/entrypoint.sh
          node --check panels/valheim/app/static/app.js
          node --check panels/valheim/app/static/login.js
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: valheim-panel
            context: ./panels/valheim
          - image: valheim-runtime
            context: ./panels/valheim/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kortechtim/${{ matrix.image }}:latest
            ghcr.io/kortechtim/${{ matrix.image }}:${{ github.sha }}
      - name: Publish non-root Valheim runtime channel
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.image == 'valheim-runtime'
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/kortechtim/valheim-runtime:steamcmd-nonroot-v1 \
            ghcr.io/kortechtim/valheim-runtime:${GITHUB_SHA}
      - name: Verify Valheim runtime drops root privileges
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.image == 'valheim-runtime'
        run: |
          docker pull "ghcr.io/kortechtim/valheim-runtime:${GITHUB_SHA}"
          docker run --rm "ghcr.io/kortechtim/valheim-runtime:${GITHUB_SHA}" check-user
