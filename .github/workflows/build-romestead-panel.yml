name: Build Romestead Panel

on:
  pull_request:
    paths:
      - "panels/romestead/**"
      - "romestead/**"
      - ".github/workflows/build-romestead-panel.yml"

  push:
    branches:
      - main
    paths:
      - "panels/romestead/**"
      - "romestead/**"
      - ".github/workflows/build-romestead-panel.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kortechtim/romestead-panel

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Romestead tests
        run: python -m unittest discover -s panels/romestead/tests -v

      - name: Check Python and shell scripts
        run: |
          python -m py_compile panels/romestead/app/main.py
          bash -n romestead/romestead-webui-install.sh
          bash -n panels/romestead/runtime/entrypoint.sh

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Romestead runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./panels/romestead/runtime
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/kortechtim/romestead-runtime:latest
            ghcr.io/kortechtim/romestead-runtime:steamcmd-nonroot-v1
            ghcr.io/kortechtim/romestead-runtime:${{ github.sha }}

      - name: Verify Romestead runtime drops root privileges
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker pull "ghcr.io/kortechtim/romestead-runtime:${GITHUB_SHA}"
          docker run --rm "ghcr.io/kortechtim/romestead-runtime:${GITHUB_SHA}" check-user

      - name: Build and push Romestead panel image
        uses: docker/build-push-action@v6
        with:
          context: ./panels/romestead
          file: ./panels/romestead/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
